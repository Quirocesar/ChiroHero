name: Quality Checks

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check encoding
        run: npm run check:encoding

      - name: Check i18n keys
        run: npm run check:i18n

      - name: Economy simulation smoke test
        run: npm run qa:economy

      - name: Lint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check

      - name: Build web smoke test
        run: npm run build:web
